spring.application.name=nexora-store

spring.config.import=optional:file:.env[.properties]
spring.profiles.group.dev=openai

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/nexora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false

nexora.jwt.secret=${JWT_SECRET:dev-only-secret-not-for-production-0123456789}

nexora.admin.email=${ADMIN_EMAIL:}
nexora.admin.password=${ADMIN_PASSWORD:}

nexora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500}

spring.cache.type=caffeine
spring.cache.cache-names=products,brands
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

nexora.alerts.enabled=true
nexora.alerts.interval=PT5M
nexora.alerts.initial-delay=PT30S
nexora.alerts.look-back=7d

nexora.advisor.provider=offline
nexora.advisor.timeout=30s
spring.ai.model.chat=none

spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none