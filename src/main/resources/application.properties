spring.application.name=nexora-store

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/nexora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false

nexora.jwt.secret=${JWT_SECRET:dev-only-secret-not-for-production-0123456789}

nexora.admin.email=${ADMIN_EMAIL:}
nexora.admin.password=${ADMIN_PASSWORD:}