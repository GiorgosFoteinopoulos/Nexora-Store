<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Nexora Store</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/login.js"></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark">N</span>
            <span class="brand-text">Nexora Store</span>
        </a>
        <form class="search" action="index.html" method="get" role="search">
            <input name="q" type="search" placeholder="Search phones, laptops, watches..."
                   autocomplete="off" aria-label="Search products">
        </form>
        <nav id="account" class="account"></nav>
    </div>
</header>
<main class="container">
    <section class="auth-card">
        <h1>Log in</h1>
        <form id="login-form" class="stack">
            <label>Email
                <input name="email" type="email" autocomplete="username" required>
            </label>
            <label>Password
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <div id="feedback" aria-live="polite"></div>
            <button type="submit">Log in</button>
        </form>
        <p class="auth-switch">New here? <a id="register-link" href="register.html">Create an account</a> </p>
    </section>
</main>

<footer class="site-footer">
    <div class="container">Nexora Technologies is a fictional company. Demo project.</div>
</footer>
</body>
