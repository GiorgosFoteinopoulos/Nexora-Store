
log_format with_id '$remote_addr [$time_local] "$request" $status $body_bytes_sent ${request_time}s rid=$request_id';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log with_id;

    gzip on;
    gzip_types text/css application/javascript application/json;

  
    location ~ ^/(api/|swagger-ui|v3/api-docs|actuator/health|actuator/metrics) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        
        proxy_set_header X-Request-Id $request_id;
        
        proxy_hide_header X-Request-Id;
        add_header X-Request-Id $request_id always;
    }

    
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}