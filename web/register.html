<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account · Nexora Store</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/register.js"></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark">N</span>
            <span class="brand-text">Nexora Store</span>
        </a>
        <form class="search" action="index.html" method="get" role="search">
            <input name="q" type="search" placeholder="Search phones, laptops, watches…"
                   autocomplete="off" aria-label="Search products">
        </form>
        <nav id="account" class="account"></nav>
    </div>
</header>

<main class="container">
    <section class="auth-card">
        <h1>Create an account</h1>
        <form id="register-form" class="stack">
            <label>Email
                <input name="email" type="email" autocomplete="username" maxlength="254" required>
            </label>
            <label>Password <span class="hint">8 to 72 characters</span>
                <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            </label>
            <label>Repeat the password
                <input name="repeat" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            </label>
            <div id="feedback" aria-live="polite"></div>
            <button type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
</main>

<footer class="site-footer">
    <div class="container">Nexora Technologies is a fictional company. Demo project.</div>
</footer>
</body>
</html>
